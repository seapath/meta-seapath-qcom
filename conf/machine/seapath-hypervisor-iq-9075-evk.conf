#@TYPE: Machine
#@NAME: seapath-hypervisor-iq-9075-evk
#@SOC: ARM64
#@DESCRIPTION: Machine configuration for hypervisor compatible with SEAPATH on iq-9075-evk board

require conf/machine/iq-9075-evk.conf
require conf/machine/seapath-machine-common-qcom.inc

APPEND += " \
    ${@bb.utils.contains('DISTRO_FEATURES', 'seapath-overlay', 'init=/sbin/init.sh', '', d)} \
    default_hugepagesz=1G \
    hugepagesz=1G \
    skew_tick=1 \
    rcutree.kthread_prio=10 \
    kvm.halt_poll_ns=0 \
    "

# Remove these dtbo
# qcs9075-camera-iq-9075-evk-el2.dtbo
# qcs9075-camera-iq-9075-evk.dtbo
# qcs9100-graphics.dtbo
# sa8775p-video.dtbo
KERNEL_TECH_DTBOS[qcs9075-addons-iq-9075-evk-el2] = ""
KERNEL_TECH_DTBOS[qcs9075-addons-iq-9075-evk] = ""
KERNEL_TECH_DTBO_PROVIDERS = ""
